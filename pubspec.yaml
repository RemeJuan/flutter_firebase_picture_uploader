name: firebase_picture_uploader
description: Picture upload widget which helps selecting and uploading one or multiple images to firebase storage.
version: 1.3.2
homepage: https://github.com/Rodiii/flutter_firebase_picture_uploader
maintainer: Christoph Rothermel (@rothech)

environment:
  sdk: ">=3.0.6 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
    
  cached_network_image: ^3.4.1
  firebase_storage: ^13.0.6
  firebase_core: ^4.4.0
  image: ^4.7.2 
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8


dev_dependencies:
  flutter_test:
    sdk: flutter
 
